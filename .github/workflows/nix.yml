name: Nix

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Linux package and development shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Nix files are formatted
        run: nix fmt -- --fail-on-change
      - name: Evaluate both Linux architectures
        run: nix flake check --no-build --all-systems
      - name: Build the package and check both executables
        run: nix flake check --print-build-logs --max-jobs 2 --cores 2
      - name: Check the development shell
        run: |
          nix develop --command bash -euc '
            rustc --version
            cargo --version
            pkg-config --atleast-version=4.20 gtk4
            pkg-config --atleast-version=1.8 libadwaita-1
            pkg-config --atleast-version=2.50 webkitgtk-6.0
          '
